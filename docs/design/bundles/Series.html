:border-box}\n.prim:hover{background:#2E2B23;color:#E9DFC6}\n.sw{width:36px;height:36px;border:0;border-radius:6px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}\n.sw:hover{background:#1C1C1C}\n.sw-on{background:#2A2A2A}\n.lbl{margin:0;font:600 11px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#A3A3A3}\n.ptile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:84px;border:1px solid #242424;border-radius:12px;background:rgba(18,18,18,.92);color:#EAEAEA;font:600 12px/1.25 Inter,system-ui,sans-serif;cursor:pointer;padding:10px 6px;text-align:center}\n.ptile:hover{border-color:#4D4636;background:#1E1C17}\n.ptile-on{border-color:#D6C7A1;background:#1E1C17}\n.tab{display:flex;align-items:center;min-height:44px;padding:0 4px;color:#A3A3A3;font:500 13px Inter,system-ui,sans-serif;text-decoration:none;border-bottom:2px solid transparent;box-sizing:border-box}\n.tab:hover{color:#F5F5F5}\n.tab-on{color:#F5F5F5;border-bottom-color:#D6C7A1}\n.panel{background:rgba(17,17,17,.88);border:1px solid #242424;border-radius:12px}\n.h{margin:0;font:600 15px 'Space Grotesk',Inter,sans-serif;letter-spacing:-.01em}\n.mono{font-family:'JetBrains Mono',monospace}\n.mut{color:#A3A3A3}\n.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid #2E2E2E;background:#141414;font:600 12px Inter,system-ui,sans-serif}\n.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}\n.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:5px;font:500 11px 'JetBrains Mono',monospace;border:1px solid #2E2E2E;color:#D9D9D9;background:#121212}\n.bar{height:8px;border-radius:4px;background:#1E1E1E;overflow:hidden}\n.well{background:#0D0D0D;border:1px solid #242424;border-radius:8px}\ninput[type=range]{accent-color:#D6C7A1;width:100%;margin:0;height:28px}\ninput[type=checkbox]{accent-color:#D6C7A1;width:18px;height:18px;margin:0}\n.graph{background-color:#0B0C0E;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:120px 120px,120px 120px,24px 24px,24px 24px}\n.chip{position:absolute;transform:translate(-50%,-130%);padding:3px 8px;border-radius:6px;background:rgba(11,12,14,.92);border:1px solid #2A2D33;font:400 12px 'JetBrains Mono',monospace;color:#ECEAE6;white-space:nowrap;pointer-events:none}\n@keyframes flow{to{stroke-dashoffset:-48}}\n.flow{animation:flow 1.6s linear infinite}\n.still .flow{animation-play-state:paused}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"paper\" style=\"width: 1440px; height: 1400px; box-sizing: border-box; padding: 56px 64px; display: flex; flex-direction: column; gap: 28px; color: #EAEAEA; font-family: Inter, system-ui, sans-serif; overflow: hidden\">\n\n  <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 24px\">\n    <div style=\"display: flex; flex-direction: column; gap: 8px\">\n      <p class=\"lbl\">Series foundations · app 5 of 5<\u002Fp>\n      <h1 style=\"margin: 0; font: 700 44px/1.05 'Space Grotesk', Inter, sans-serif; letter-spacing: -0.02em\">What Structures adds to the series<\u002Fh1>\n      <p style=\"margin: 0; font-size: 16px; color: #C9C9C9; max-width: 820px; line-height: 1.5\">Same shell, same engines, one new accent. A bridge, a tower, the ground under it and the material it is made of, each with a Playground and an Advanced form of the same project.<\u002Fp>\n    <\u002Fdiv>\n    <span class=\"badge\" style=\"color: #E8A39E; border-color: #5C2A25\">Educational. Not for real structural design.<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px\">\n    <div class=\"panel\" style=\"padding: 14px; display: flex; flex-direction: column; gap: 8px; border-top: 3px solid #F2A33A\"><span style=\"font: 600 15px 'Space Grotesk', Inter, sans-serif\">Breadbox<\u002Fspan><span class=\"mut\" style=\"font-size: 12px; line-height: 1.45\">Circuits. Breadboard playground, SPICE schematic.<\u002Fspan><\u002Fdiv>\n    <div class=\"panel\" style=\"padding: 14px; display: flex; flex-direction: column; gap: 8px; border-top: 3px solid #86A2FF\"><span style=\"font: 600 15px 'Space Grotesk', Inter, sans-serif\">Chem Playground<\u002Fspan><span class=\"mut\" style=\"font-size: 12px; line-height: 1.45\">Reactions. 2.5D bench, kinetics netlist, mechanisms.<\u002Fspan><\u002Fdiv>\n    <div class=\"panel\" style=\"padding: 14px; display: flex; flex-direction: column; gap: 8px; border-top: 3px solid #4BE3A0\"><span style=\"font: 600 15px 'Space Grotesk', Inter, sans-serif\">Bio Playground<\u002Fspan><span class=\"mut\" style=\"font-size: 12px; line-height: 1.45\">Living systems. 2.5D lab, pathway models.<\u002Fspan><\u002Fdiv>\n    <div class=\"panel\" style=\"padding: 14px; display: flex; flex-direction: column; gap: 8px; border-top: 3px solid #EE84E0\"><span style=\"font: 600 15px 'Space Grotesk', Inter, sans-serif\">Weather Playground<\u002Fspan><span class=\"mut\" style=\"font-size: 12px; line-height: 1.45\">The sky. Air parcels, skew-T, grid atmosphere.<\u002Fspan><\u002Fdiv>\n    <div class=\"panel\" style=\"padding: 14px; display: flex; flex-direction: column; gap: 8px; border-top: 3px solid #D6C7A1; background: #1C1B17; border-color: #3A372E\"><span style=\"font: 600 15px 'Space Grotesk', Inter, sans-serif; color: #E9DFC6\">Structures Playground<\u002Fspan><span style=\"font-size: 12px; line-height: 1.45; color: #D9D3C2\">Things that stand up. Bridge, tower, ground, materials.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px\">\n\n    <section class=\"panel\" style=\"grid-column: span 7; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n      <h2 class=\"h\" style=\"font-size: 18px\">Shared engines, and who uses them<\u002Fh2>\n      <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 13px\">\n        <sc-raw-thead><sc-raw-tr style=\"color: #A3A3A3\"><sc-raw-th scope=\"col\" style=\"text-align: left; padding: 6px 8px; font-weight: 600\">Engine<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding: 6px; font-weight: 600; color: #F2A33A\">Circuit<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding: 6px; font-weight: 600; color: #86A2FF\">Chem<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding: 6px; font-weight: 600; color: #4BE3A0\">Bio<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding: 6px; font-weight: 600; color: #EE84E0\">Weather<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding: 6px; font-weight: 600; color: #D6C7A1\">Structures<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody class=\"mono\" style=\"text-align: center\">\n          <sc-raw-tr style=\"border-top: 1px solid #222\"><sc-raw-td style=\"text-align: left; padding: 8px; font-family: Inter, sans-serif\">Playground ⇄ Advanced toggle<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td style=\"color: #D6C7A1\">●<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-top: 1px solid #222\"><sc-raw-td style=\"text-align: left; padding: 8px; font-family: Inter, sans-serif\">Netlist parser (.directives)<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td style=\"color: #D6C7A1\">●<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-top: 1px solid #222\"><sc-raw-td style=\"text-align: left; padding: 8px; font-family: Inter, sans-serif\">Sparse linear solve A·x = b<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td class=\"mut\">○<\u002Fsc-raw-td><sc-raw-td class=\"mut\">○<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td style=\"color: #D6C7A1\">● new: K·u = F<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-top: 1px solid #222\"><sc-raw-td style=\"text-align: left; padding: 8px; font-family: Inter, sans-serif\">ODE integrator (stiff)<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td style=\"color: #D6C7A1\">● sway, quakes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-top: 1px solid #222\"><sc-raw-td style=\"text-align: left; padding: 8px; font-family: Inter, sans-serif\">Eigen solver<\u002Fsc-raw-td><sc-raw-td class=\"mut\">○<\u002Fsc-raw-td><sc-raw-td class=\"mut\">○<\u002Fsc-raw-td><sc-raw-td class=\"mut\">○<\u002Fsc-raw-td><sc-raw-td class=\"mut\">○<\u002Fsc-raw-td><sc-raw-td style=\"color: #D6C7A1\">● new: modes, buckling<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-top: 1px solid #222\"><sc-raw-td style=\"text-align: left; padding: 8px; font-family: Inter, sans-serif\">Grid fluid engine<\u002Fsc-raw-td><sc-raw-td class=\"mut\">○<\u002Fsc-raw-td><sc-raw-td class=\"mut\">○<\u002Fsc-raw-td><sc-raw-td class=\"mut\">○<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td style=\"color: #D6C7A1\">● wind tunnel<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-top: 1px solid #222\"><sc-raw-td style=\"text-align: left; padding: 8px; font-family: Inter, sans-serif\">Plot kit + provenance badges<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td style=\"color: #D6C7A1\">●<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-top: 1px solid #222\"><sc-raw-td style=\"text-align: left; padding: 8px; font-family: Inter, sans-serif\">Challenge framework<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td style=\"color: #D6C7A1\">● budgets, scores<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <p class=\"mut\" style=\"margin: 0; font-size: 12px; line-height: 1.5\">● uses it · ○ not yet. The stiffness method is nodal analysis with springs instead of resistors, so Breadbox’s DC solver and the truss solver can be one module.<\u002Fp>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"grid-column: span 5; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n      <h2 class=\"h\" style=\"font-size: 18px\">Bridges to the other apps<\u002Fh2>\n      <div class=\"well\" style=\"padding: 12px 14px; display: flex; flex-direction: column; gap: 6px\">\n        <span style=\"font-size: 13px; font-weight: 600; color: #F2A33A\">Breadbox · vibration is an RLC circuit<\u002Fspan>\n        <span class=\"mono\" style=\"font-size: 13px\">m·ẍ + c·ẋ + k·x = F(t)<\u002Fspan>\n        <span class=\"mono\" style=\"font-size: 13px; color: #C9C9C9\">L·q̈ + R·q̇ + q/C = V(t)<\u002Fspan>\n        <span class=\"mut\" style=\"font-size: 12px\">Open a tower’s sway as a circuit. A tuned mass damper is a notch filter.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"well\" style=\"padding: 12px 14px; display: flex; flex-direction: column; gap: 4px\">\n        <span style=\"font-size: 13px; font-weight: 600; color: #EE84E0\">Weather · hurricane in, wind load out<\u002Fspan>\n        <span class=\"mut\" style=\"font-size: 12px\">Export a storm from the grid sandbox as a <span class=\"mono\">.wind<\u002Fspan> profile and point it at any tower.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"well\" style=\"padding: 12px 14px; display: flex; flex-direction: column; gap: 4px\">\n        <span style=\"font-size: 13px; font-weight: 600; color: #86A2FF\">Chem · diffusion in metals<\u002Fspan>\n        <span class=\"mut\" style=\"font-size: 12px\">Carbon diffusing into steel (case hardening) reuses the chem diffusion kernel.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"well\" style=\"padding: 12px 14px; display: flex; flex-direction: column; gap: 4px\">\n        <span style=\"font-size: 13px; font-weight: 600; color: #D9D9D9\">Automata explorer · grain growth<\u002Fspan>\n        <span class=\"mut\" style=\"font-size: 12px\">Metal grains coarsening under heat is a cellular automaton on the shared grid.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"grid-column: span 5; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n      <h2 class=\"h\" style=\"font-size: 18px\">Netlist directives<\u002Fh2>\n      <div class=\"mono\" style=\"display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 7px 12px; font-size: 12px; line-height: 1.4\">\n        <span style=\"color: #D6C7A1\">.node<\u002Fspan><span style=\"color: #C9C9C9\">name x y [fix=xy|y]<\u002Fspan>\n        <span style=\"color: #D6C7A1\">.member<\u002Fspan><span style=\"color: #C9C9C9\">id a b section<\u002Fspan>\n        <span style=\"color: #D6C7A1\">.material<\u002Fspan><span style=\"color: #C9C9C9\">name E fy rho [curve=…]<\u002Fspan>\n        <span style=\"color: #D6C7A1\">.section<\u002Fspan><span style=\"color: #C9C9C9\">name A I<\u002Fspan>\n        <span style=\"color: #D6C7A1\">.load<\u002Fspan><span style=\"color: #C9C9C9\">case nodes Fx Fy | moving lane<\u002Fspan>\n        <span style=\"color: #D6C7A1\">.static<\u002Fspan><span style=\"color: #C9C9C9\">linear | nonlinear<\u002Fspan>\n        <span style=\"color: #D6C7A1\">.buckle<\u002Fspan><span style=\"color: #C9C9C9\">euler K | eigen n<\u002Fspan>\n        <span style=\"color: #D6C7A1\">.story<\u002Fspan><span style=\"color: #C9C9C9\">n height mass system<\u002Fspan>\n        <span style=\"color: #D6C7A1\">.wind<\u002Fspan><span style=\"color: #C9C9C9\">V10 alpha | file=storm.wx<\u002Fspan>\n        <span style=\"color: #D6C7A1\">.soil<\u002Fspan><span style=\"color: #C9C9C9\">layer depth type<\u002Fspan>\n        <span style=\"color: #D6C7A1\">.foundation<\u002Fspan><span style=\"color: #C9C9C9\">footing | mat | piles L n | caisson<\u002Fspan>\n        <span style=\"color: #D6C7A1\">.dynamic<\u002Fspan><span style=\"color: #C9C9C9\">quake|gust t_end dt damping<\u002Fspan>\n        <span style=\"color: #D6C7A1\">.plot<\u002Fspan><span style=\"color: #C9C9C9\">expr vs var range<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"grid-column: span 4; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n      <h2 class=\"h\" style=\"font-size: 18px\">Challenge ladder<\u002Fh2>\n      <ol style=\"margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 5px; font-size: 13px; line-height: 1.4; color: #D9D9D9\">\n        <li><span style=\"color: #E9DFC6\">River crossing<\u002Fspan>: 20 t, under $30k<\u002Fli>\n        <li>Overhang: hold 5 t out over the water<\u002Fli>\n        <li>Heavy haul: two 25 t loads, piers allowed<\u002Fli>\n        <li>Snap test: survive losing any one member<\u002Fli>\n        <li>Lightest bridge duel (vs a friend or the optimizer)<\u002Fli>\n        <li>Material roulette<\u002Fli>\n        <li>Shake table: find the resonance<\u002Fli>\n        <li>100 floors, under budget<\u002Fli>\n        <li>Tame the sway: tune the mass damper<\u002Fli>\n        <li>The lean of Pisa, and the fix<\u002Fli>\n        <li>Liquefaction: keep it upright<\u002Fli>\n        <li><span style=\"color: #E8A39E\">Boss<\u002Fspan>: quake + hurricane on soft clay<\u002Fli>\n      <\u002Fol>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"grid-column: span 3; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n      <h2 class=\"h\" style=\"font-size: 18px\">Next layers<\u002Fh2>\n      <ul style=\"margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.4; color: #D9D9D9\">\n        <li>2D/3D finite element sandbox with stress heat maps<\u002Fli>\n        <li>Topology optimization: watch material melt away<\u002Fli>\n        <li>Rigid joints and beams, not just pin-jointed trusses<\u002Fli>\n        <li>Fatigue, creep, temperature<\u002Fli>\n        <li>Phase diagrams, alloys, grain growth<\u002Fli>\n        <li>Scour around bridge piers<\u002Fli>\n        <li>Vortex shedding in the wind tunnel<\u002Fli>\n      <\u002Ful>\n    <\u002Fsection>\n\n    <section class=\"panel\" style=\"grid-column: span 12; padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px\">\n      <h2 class=\"h\">Provenance<\u002Fh2>\n      <span class=\"badge\"><span class=\"dot\" style=\"background: #4BE3A0\"><\u002Fspan>Exact for the model: truss statics, Euler buckling<\u002Fspan>\n      <span class=\"badge\"><span class=\"dot\" style=\"background: #D6C7A1\"><\u002Fspan>Simplified: wind profile, sway, soil bearing and settlement, collapse physics<\u002Fspan>\n      <span class=\"badge\"><span class=\"dot\" style=\"background: #A3A3A3\"><\u002Fspan>Illustrative: soil presets, comfort bands, game costs<\u002Fspan>\n      <span style=\"font-size: 12px; color: #A3A3A3\">Data: Materials Project is open (credit it); MatWeb’s terms are restrictive, so don’t bundle it. Check every source’s license first.<\u002Fspan>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1400}}\">\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
