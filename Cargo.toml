[workspace]
resolver = "3"
members = [
    "crates/sp-theme",
    "crates/sp-engine",
    "crates/structures-playground",
    "crates/sp-shared",
    "crates/sp-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/alexwhb/lab-structures"
rust-version = "1.90"

[workspace.dependencies]
# Shared, version-pinned deps (the same versions Breadbox, Chem and Automata Playground use).
egui = "0.37.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "persistence"] }
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
# The lab-series shared libraries (github.com/alexwhb/labkit), pinned to a commit. To build
# against a local ../labkit checkout instead, see "Working on labkit" in CLAUDE.md.
lab-theme = { git = "https://github.com/alexwhb/labkit", rev = "652ac42b4b7bbb03eb5893e8413c92ec05ccaa98" }
lab-ui = { git = "https://github.com/alexwhb/labkit", rev = "652ac42b4b7bbb03eb5893e8413c92ec05ccaa98" }
lab-mcp = { git = "https://github.com/alexwhb/labkit", rev = "652ac42b4b7bbb03eb5893e8413c92ec05ccaa98", default-features = false }
# This workspace's crates.
sp-theme = { path = "crates/sp-theme" }
sp-engine = { path = "crates/sp-engine" }
sp-shared = { path = "crates/sp-shared" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
